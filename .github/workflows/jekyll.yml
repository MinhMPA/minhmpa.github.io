name: Deploy Hugo Site to GitHub Pages

env:
  HUGO_VERSION: '0.149.0'

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    # First of each month, 02:17 UTC (09:17 in Viet Nam).
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps for generator tests
        run: pip install -r scripts/requirements.txt

      - name: Run publication and FAQ tests
        run: python3 -m pytest tests/test_build_publications_pdf.py tests/test_build_publications_page.py tests/test_build_faq_from_wiki.py -q

      - name: Test research-bot matcher
        run: node --test tests/*.test.mjs

      - name: Refresh publications from INSPIRE
        run: python3 scripts/build_publications_page.py --snapshot-output /tmp/publications-source.json

      - name: Save publication source and page for review
        uses: actions/upload-artifact@v4
        with:
          name: inspire-publications
          path: |
            /tmp/publications-source.json
            content/publications/index.md

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "https://minhmpa.github.io/"

      - name: Check homepage navigation
        run: python3 -m pytest tests/test_homepage.py -q

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
